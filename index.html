<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HACKER SOLITARIO OS v4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:monospace}
body{background:#000;color:#0f0;height:100vh;overflow:hidden}
#desktop{background:#121a25;height:100vh;padding:10px}
.icon{width:70px;text-align:center;padding:8px;cursor:pointer;display:inline-block;margin:5px;border-radius:6px}
.icon:hover{background:rgba(0,255,0,.2)}
.icon b{font-size:30px;display:block}
.window{position:absolute;left:1%;top:2%;width:98%;height:88%;background:#000;border:2px solid #0f0;display:none;flex-direction:column;z-index:10}
.window.active{display:flex}
.titlebar{background:#0f0;color:#000;padding:6px 10px;display:flex;justify-content:space-between;font-weight:bold}
.term{flex:1;overflow-y:auto;padding:10px;font-size:12px}
.input{display:flex;background:#111;border-top:1px solid #0f0;padding:6px}
.input input{flex:1;background:#000;border:none;color:#0f0;outline:none}
.net{background:#111;border:1px solid #0a0;margin:6px 0;padding:8px;cursor:pointer}
.net:hover{border-color:#0f0;background:#1a2a1a}
.net b{color:#0f0}
.tag{font-size:10px;background:#0f0;color:#000;padding:2px 4px;margin-left:5px}
#addBtn{background:#0f0;color:#000;border:none;padding:10px;width:100%;font-weight:bold;cursor:pointer}
.host{background:#111;border:1px solid #0a0;padding:8px;margin:5px 0;display:flex;justify-content:space-between;cursor:pointer}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:50}
.modal.active{display:flex}
.modal-box{background:#000;border:2px solid #0f0;padding:15px;width:90%;max-width:380px}
.modal-box input,select{width:100%;background:#111;border:1px solid #0f0;color:#0f0;padding:7px;margin:4px 0}
#taskbar{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:2px solid #0f0;padding:5px 10px;font-size:11px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div id="desktop">
<div class="icon" onclick="openW('termux')"><b>📱</b><span>Termux</span></div>
<div class="icon" onclick="openW('connect')"><b>🔌</b><span>ConnectBot</span></div>
<div class="icon" onclick="openW('nmap')"><b>🌐</b><span>Nmap</span></div>
</div>

<div id="termux" class="window active">
<div class="titlebar"><span>Termux</span><b onclick="closeW('termux')" style="cursor:pointer">[X]</b></div>
<div id="tout" class="term"></div>
<div class="input"><span>$ </span><input id="tin" placeholder="help"></div>
</div>

<div id="nmap" class="window">
<div class="titlebar"><span>Nmap - Scanner de Redes Próximas</span><b onclick="closeW('nmap')" style="cursor:pointer">[X]</b></div>
<div style="padding:10px;display:flex;gap:5px">
<input id="nin" placeholder="192.168.1.0/24 ou deixe vazio p/ escanear perto" style="flex:1;background:#111;border:1px solid #0f0;color:#0f0;padding:8px">
<button onclick="scanNear()" style="background:#0f0;color:#000;border:none;padding:8px;font-weight:bold">SCAN</button>
</div>
<div id="nout" class="term"></div>
</div>

<div id="connect" class="window">
<div class="titlebar"><span>ConnectBot - Hosts</span><b onclick="closeW('connect')" style="cursor:pointer">[X]</b></div>
<div id="hosts" style="padding:10px;overflow-y:auto"></div>
<button id="addBtn" onclick="showAdd()">+ ADICIONAR HOST MANUAL</button>
<div id="cterm" class="term" style="display:none;border-top:2px solid #0f0"></div>
<div id="cinput" class="input" style="display:none"><span># </span><input id="cin"></div>
<div id="addModal" class
