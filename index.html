<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKER SOLITARIO OS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Courier New',monospace}
body{background:#0a0a0a;color:#0f0;overflow:hidden;height:100vh}
#desktop{background:linear-gradient(135deg,#0f1419,#1a2a1a);height:100vh;padding:15px;display:grid;grid-template-columns:80px 1fr;gap:10px}
#icons{display:flex;flex-direction:column;gap:15px}
.icon{width:70px;text-align:center;cursor:pointer;padding:8px;border-radius:4px}
.icon:hover{background:rgba(0,255,0,0.2)}
.icon b{font-size:30px;display:block}
.icon span{font-size:10px;color:#8f8}
.window{position:absolute;background:#000;border:2px solid #0f0;box-shadow:0 0 20px #0f05;width:90%;max-width:600px;height:60%;display:none;flex-direction:column;z-index:10}
.window.active{display:flex}
.titlebar{background:#0f0;color:#000;padding:5px 10px;display:flex;justify-content:space-between;font-weight:bold;cursor:move}
#termux{top:10%;left:5%}
#connect{top:15%;left:8%}
#nmapwin{top:20%;left:10%}
.term-body{flex:1;overflow-y:auto;padding:10px;font-size:13px;background:#000}
.input-line{display:flex;gap:5px;padding:8px;background:#111;border-top:1px solid #0f0}
.input-line input{flex:1;background:#000;border:none;color:#0f0;outline:none}
#taskbar{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:2px solid #0f0;padding:6px 10px;display:flex;justify-content:space-between;font-size:12px}
.btn{background:#0f0;color:#000;border:none;padding:4px 8px;cursor:pointer;font-weight:bold;margin-left:5px}
</style>
</head>
<body>
<div id="desktop">
<div id="icons">
<div class="icon" onclick="openApp('termux')"><b>📱</b><span>Termux</span></div>
<div class="icon" onclick="openApp('connect')"><b>🔌</b><span>ConnectBot</span></div>
<div class="icon" onclick="openApp('nmapwin')"><b>🌐</b><span>Nmap</span></div>
<div class="icon" onclick="alert('Dinheiro: $'+money+'\nUse: buy termux, buy nmap, buy connectbot')"><b>💰</b><span>Loja</span></div>
</div>
</div>

<div id="termux" class="window active">
<div class="titlebar"><span>termux@localhost ~</span><span style="cursor:pointer" onclick="closeApp('termux')">[X]</span></div>
<div id="termux-out" class="term-body"></div>
<div class="input-line"><span>$</span><input id="termux-in" placeholder="digite help" autocomplete="off"></div>
</div>

<div id="connect" class="window">
<div class="titlebar"><span>ConnectBot - SSH</span><span style="cursor:pointer" onclick="closeApp('connect')">[X]</span></div>
<div id="connect-out" class="term-body"></div>
<div class="input-line"><span>ssh></span><input id="connect-in" placeholder="ssh user@ip"></div>
</div>

<div id="nmapwin" class="window">
<div class="titlebar"><span>Nmap Scanner</span><span style="cursor:pointer" onclick="closeApp('nmapwin')">[X]</span></div>
<div id="nmap-out" class="term-body"></div>
<div class="input-line"><span>nmap></span><input id="nmap-in" placeholder="nmap 127.0.0.1"></div>
</div>

<div id="taskbar"><span id="status">HACKER SOLITARIO OS v2.0 | root@kali</span><span>💵 $<span id="money">50</span></span></div>

<script>
let money=50;
let isRoot=false;
let fs={home:{'notes.txt':'senha do roteador: 1234','target.txt':'192.168.1.1\n10.0.0.5'},'etc':{}};
let path=['home'];
let owned={termux:true, connectbot:false, nmap:false};

function log(el,txt){el.innerHTML+=txt+'<br>';el.scrollTop=el.scrollHeight}
function openApp(id){document.getElementById(id).classList.add('active')}
function closeApp(id){document.getElementById(id).classList.remove('active')}

const termOut=document.getElementById('termux-out');
const termIn=document.getElementById('termux-in');
log(termOut, "Bem vindo ao Termux.");
log(termOut, "Digite 'help' para comandos. 'su' para root.");

termIn.addEventListener('keydown',e=>{
 if(e.key==='Enter'){
  let cmd=termIn.value.trim();
  let args=cmd.split(' ');
  log(termOut, `<span style="color:#555">${isRoot?'#':'$'} ${cmd}</span>`);
  handleTermux(args[0].toLowerCase(),args.slice(1),cmd);
  termIn.value='';
 }
});

function handleTermux(c,a,full){
 switch(c){
  case 'help': log(termOut, "Comandos: help, su, whoami, pwd, ls, cd [pasta], cat [arquivo], clear, rd/rmdir, mkdir, nmap, ssh, node, buy [app], money"); break;
  case 'su': isRoot=true; log(termOut, "root@kali - acesso root concedido."); document.getElementById('status').innerText="HACKER SOLITARIO OS v2.0 | root@kali [ROOT]"; break;
  case 'whoami': log(termOut, isRoot?'root':'solitario'); break;
  case 'pwd': log(termOut, '/'+path.join('/')); break;
  case 'ls': let cur=fs; for(let p of path) cur=cur[p]; log(termOut, Object.keys(cur).join(' ')); break;
  case 'cat': { let cur=fs; for(let p of path) cur=cur[p]; if(cur[a[0]]) log(termOut, cur[a[0]]); else log(termOut, "cat: arquivo nao encontrado: "+a[0]); } break;
  case 'clear': termOut.innerHTML=''; break;
  case 'rd': case 'rmdir': case 'rm': log(termOut, a[0]?"removido: "+a[0]:"use: rd [nome]"); if(a[0]){ let cur=fs; for(let p of path) cur=cur[p]; delete cur[a[0]]; } break;
  case 'mkdir': if(!isRoot){log(termOut,"mkdir: permissao negada, use su");}else{ let cur=fs; for(let p of path) cur=cur[p]; cur[a[0]]={}; log(termOut,"diretorio criado: "+a[0]); } break;
  case 'money': log(termOut, "Saldo: $"+money); break;
  case 'buy': if(a[0]=='termux'){owned.termux=true;log(termOut,"ja tem termux")} else if(a[0]=='connectbot' && money>=50){money-=50;owned.connectbot=true;log(termOut,"ConnectBot comprado! Clique no icone.");} else if(a[0]=='nmap' && money>=100){money-=100;owned.nmap=true;log(termOut,"Nmap comprado!");} else log(termOut,"use: buy connectbot ($50) ou buy nmap ($100)"); document.getElementById('money').innerText=money; break;
  case 'nmap': openApp('nmapwin'); document.getElementById('nmap-in').value=full.replace('nmap','').trim(); simulateNmap(); break;
  case 'ssh': openApp('connect'); break;
  case 'node': case 'javascript': log(termOut, "> node v18"); try{ let res=eval(a.join(' ')); log(termOut, String(res)); }catch(e){ log(termOut, "Digite: node 2+2 ou node 'teste'.toUpperCase()"); } break;
  case '': break;
  default: log(termOut, c+": comando nao encontrado. Digite help");
 }
}

// NMAP fake
function simulateNmap(){
 let out=document.getElementById('nmap-out');
 let target=document.getElementById('nmap-in').value||'127.0.0.1';
 log(out, `Iniciando Nmap 7.94 em ${target}`);
 setTimeout(()=>{log(out, `PORT STATE SERVICE\n22/tcp open ssh\n80/tcp open http\n443/tcp open https`); money+=25; document.getElementById('money').innerText=money; log(out, `+ $25 por scan. Saldo: $${money}`);},1200);
}
document.getElementById('nmap-in').addEventListener('keydown',e=>{ if(e.key==='Enter'){simulateNmap(); e.target.value='';} });

// ConnectBot
let connOut=document.getElementById('connect-out');
log(connOut,"ConnectBot - SSH Client. Digite ssh root@ip");
document.getElementById('connect-in').addEventListener('keydown',e=>{
 if(e.key==='Enter'){
  let v=e.target.value;
  log(connOut, "> "+v);
  if(v.startsWith('ssh')){ log(connOut, "Conectando..."); setTimeout(()=>log(connOut,"root@"+v.split('@')[1]+":~# Conexao estabelecida. Acesso total."),1000); money+=50; document.getElementById('money').innerText=money; }
  else log(connOut,"Use: ssh root@192.168.1.1");
  e.target.value='';
 }
});
</script>
</body>
</html>
